111220.pdf"}], "confidence": "history", "confidenceLabel": "your history", "intervalText": "45,000 mi", "lastDate": "2025-01-31", "lastMiles": 45068, "dueMiles": 90068, "dueDate": null, "effective": "2028-03-03", "drivenBy": "miles", "state": "ok"}, {"label": "Wheel alignment", "basis": "No BMW interval. Common advice: check yearly; align with each new set of tires or after a hard pothole or curb hit. Five alignments in three years is more than the car needs without a pull or uneven wear.", "sources": [{"label": "When to align (testingautos)", "url": "https://www.testingautos.com/car_care/when-should-wheel-alignment-be-done.html"}], "confidence": "specialist", "confidenceLabel": "specialists", "intervalText": "2 yr", "lastDate": "2026-04-21", "lastMiles": 65151, "dueMiles": null, "dueDate": "2028-04-20", "effective": "2028-04-20", "drivenBy": "date", "state": "ok"}, {"label": "Brake fluid", "basis": "Time-based, no mileage limit: BMW's CBS calls it at 3 years, then every 2 years. Brake fluid absorbs moisture and its boiling point drops with age.", "sources": [{"label": "BMW USA maintenance booklet (2021 MY)", "url": "https://di-uploads-pod15.s3.us-east-1.amazonaws.com/bmwofescondido/uploads/2021/05/5A1BC92_21MY_BMW_Maintenance_FINAL_Print_withCover_111220.pdf"}], "confidence": "official", "confidenceLabel": "BMW", "intervalText": "2 yr", "lastDate": "2026-08-07", "lastMiles": 69962, "dueMiles": null, "dueDate": "2028-08-06", "effective": "2028-08-06", "drivenBy": "date", "state": "ok"}, {"label": "Engine air filter", "basis": "BMW: every 4th CBS oil service (about 40,000 miles), sooner in dusty conditions.", "sources": [{"label": "BMW USA maintenance booklet (2021 MY)", "url": "https://di-uploads-pod15.s3.us-east-1.amazonaws.com/bmwofescondido/uploads/2021/05/5A1BC92_21MY_BMW_Maintenance_FINAL_Print_withCover_111220.pdf"}], "confidence": "official", "confidenceLabel": "BMW", "intervalText": "40,000 mi", "lastDate": "2025-12-19", "lastMiles": 59929, "dueMiles": 99929, "dueDate": null, "effective": "2028-12-03", "drivenBy": "miles", "state": "ok"}, {"label": "Front & rear differential fluid", "basis": "BMW lists no differential service on the non-M 3 Series (effectively lifetime). BimmerWorld recommends rear-diff fluid every 50,000 miles for street cars; forum consensus puts the xDrive front diff at 50-60k.", "sources": [{"label": "BMW USA maintenance booklet (2021 MY)", "url": "https://di-uploads-pod15.s3.us-east-1.amazonaws.com/bmwofescondido/uploads/2021/05/5A1BC92_21MY_BMW_Maintenance_FINAL_Print_withCover_111220.pdf"}, {"label": "BimmerWorld rear diff service", "url": "https://www.bimmerworld.com/Driveline-Shifter/Differentials-Accessories/Rear-Differential-Fluid-Service-Kit-Red-Line-75W90.html"}], "confidence": "specialist", "confidenceLabel": "specialists", "intervalText": "50,000 mi", "lastDate": "2025-08-29", "lastMiles": 55099, "dueMiles": 105099, "dueDate": null, "effective": "2029-04-26", "drivenBy": "miles", "state": "ok"}, {"label": "Transfer case fluid", "basis": "BMW calls it a long-term fill (replace only in repairs). FCP Euro recommends a drain-and-fill every 50,000 miles: the clutch pack sheds material and there's no filter.", "sources": [{"label": "BMW USA maintenance booklet (2021 MY)", "url": "https://di-uploads-pod15.s3.us-east-1.amazonaws.com/bmwofescondido/uploads/2021/05/5A1BC92_21MY_BMW_Maintenance_FINAL_Print_withCover_111220.pdf"}, {"label": "FCP Euro transfer case kit", "url": "https://www.fcpeuro.com/products/bmw-transfer-case-service-kit-83222409710kt2"}], "confidence": "specialist", "confidenceLabel": "specialists", "intervalText": "50,000 mi", "lastDate": "2025-08-29", "lastMiles": 55099, "dueMiles": 105099, "dueDate": null, "effective": "2029-04-26", "drivenBy": "miles", "state": "ok"}, {"label": "Coolant", "basis": "BMW US calls coolant a long-term fill. Independent shops suggest about 4 years or 80,000 miles with BMW coolant (low-confidence opinion). Yours was exchanged at 65,151.", "sources" tiveworld.com/?p=245761"}, {"label": "FCP Euro on 'lifetime' fluid", "url": "https://www.fcpeuro.com/blog/bmw-lifetime-transmission-fluid-isnt-lifetime"}], "confidence": "specialist", "confidenceLabel": "specialists", "intervalText": "60,000 mi / 8 yr", "lastDate": "2026-08-07", "lastMiles": 69962, "dueMiles": 129962, "dueDate": "2034-08-07", "effective": "2031-03-20", "drivenBy": "miles", "state": "ok"}], "measurements": [{"what": "Front brake pads", "value": "10 mm", "date": "2025-04-28", "miles": 48833}, {"what": "Rear brake pads", "value": "7 mm", "date": "2025-04-28", "miles": 48833}, {"what": "Battery test", "value": "OK", "date": "2025-04-28", "miles": 48833}], "recalls": {"checked": "2026-10-31", "asOf": "Oct 31, 2026", "url": "https://my.bmwusa.com/safety-and-emission-recalls", "open": []}, "car": {"requested": "2026-10-13", "mileage": {"date": "2026-10-12", "miles": 71881}, "cbs": [{"title": "Engine oil", "status": "OK", "due": "2027-08-01"}, {"title": "Vehicle check", "status": "OK", "due": "2027-08-01"}, {"title": "Brake fluid", "status": "OK", "due": "2028-08-01"}], "checkControl": [], "tires": [{"tire": "Front left", "psi": 29.0, "target": 31.0, "under": 2.0, "low": false, "date": "2026-10-12"}, {"tire": "Front right", "psi": 30.0, "target": 31.0, "under": 1.0, "low": false, "date": "2026-10-12"}, {"tire": "Rear left", "psi": 36.0, "target": 39.0, "under": 3.0, "low": true, "date": "2026-10-12"}, {"tire": "Rear right", "psi": 35.0, "target": 39.0, "under": 4.1, "low": true, "date": "2026-10-12"}], "battery": {"code": 200, "health": "Adequate", "ok": true, "needsCharge": false, "volts": 13.5}, "url": "https://mygarage.bmwusa.com"}, "notes": [{"title": "Your oil changes run ahead of BMW's counter", "body": "BMW's CBS counts oil services and schedules the cabin filter (every 2nd), engine air filter (4th) and spark plugs (6th) by that count, assuming about 10,000 miles each. At your 5,000-mile changes, the dealer's counter calls those items at half the intended mileage. Go by the miles on this page."}, {"title": "A vibration that may still be unresolved", "body": "A $180 balance at Shrewsbury on 4/21/2026 was followed eight days later by a $400 road force balance at Medford. If you still feel it at speed, the next step is checking the wheels for runout or a bend, not balancing them a third time."}, {"title": "Recall history", "body": "Starter recall B12 01 26 (NHTSA 26V056) was done at Herb Chambers Medford on 4/29/2026. Open recalls are checked against BMW's VIN lookup on every run (above); a new one is emailed right away."}], "horizon": [{"when": "Each oil change", "what": "Look for oil leaks at the valve cover and oil filter housing gaskets", "why": "The B46/B48's known seep points, usually between 50,000 and 80,000 miles. Caught early it's a gasket, not a job. (The oil filter housing class action covers 2014-2021 cars, not this one.)"}, {"when": "Each visit", "what": "Serpentine belt inspection", "why": "No BMW interval; replace on cracks or noise."}, {"when": "60,000-100,000 mi", "what": "Coolant pumps: watch for leaks, noise or overheating warnings", "why": "This engine has two. The main pump is mechanical and belt-driven; failures are reported around 60,000-100,000 miles. A small electric auxiliary pump cools the turbo, including after shutdown; parts sellers call it a known failure point (one suggests replacing it near 60k, which is vendor opinion, not BMW's). Neither is a scheduled item."}, {"when": "If rough idle / misfires", "what": "Intake valve carbon cleaning (walnut blast)", "why": "Direct injection only, so deposits build on the valves. BMW has no interval; it's done on symptoms, typically past 60-80k."}, {"when": "Feb 2029 - Oct 2031", "what": "Current tires reach 6 years from manufacture", "why": "BMW-style 6-year age limit (DOT codes 0523, 3323, 3024, 4225). At your mileage the tread will almost certainly wear out first, around 2027-28."}], "visits": [{"date": "2022-05-04", "miles": 5152, "shop": "
